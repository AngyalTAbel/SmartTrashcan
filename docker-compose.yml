services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - iot_network

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: smarttrashcan
      POSTGRES_PASSWORD: smarttrashcan
      POSTGRES_DB: smarttrashcan
    networks:
      - iot_network

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - mosquitto
      - timescaledb
    networks:
      - iot_network

  # backend:
  #   build: ./backend
  #   container_name: trashcan_backend
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - timescaledb
  #   environment:
  #     DATABASE_URL: postgresql+psycopg://smarttrashcan:smarttrashcan@timescaledb:5432/smarttrashcan
  #     DEBUG: "True"
  #   networks:
  #     - iot_network

  simulator:
    build: ./simulator
    container_name: trashcan_simulator
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      BROKER_HOST: mosquitto
      BROKER_PORT: 1883
      DEVICE_COUNT: 4
      PUBLISH_INTERVAL: 5
      MAX_HEIGHT_CM: 100
    networks:
      - iot_network


networks:
  iot_network:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  # timescale_data: