[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "trashcan/public/+/distance"
  ]
  data_format = "value"
  data_type = "float"
  name_override = "trashcan_metrics"

  # Extract device_id using topic parsing plugin
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "trashcan/public/+/distance"
    tags = "_/_/device_id/_"

# By default, data_format="value" creates a metric field named 'value'.
# We rename this to 'distance_cm' to match the database column.
[[processors.rename]]
  [[processors.rename.replace]]
    field = "value"
    dest = "distance_cm"

[[outputs.postgresql]]
  connection = "postgres://postgres:password@timescaledb:5432/postgres?sslmode=disable"